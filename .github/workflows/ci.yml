name: Project checks

on:
  push:
    branches:
      - main
      - feature/citizen-report-workflow
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight AI test dependencies
        run: python -m pip install numpy opencv-python-headless pillow pydantic-settings python-dotenv
      - name: Check Python syntax
        run: python -m compileall -q backend/app backend/tests
      - name: Run lightweight unit tests
        run: python -m unittest discover -s backend/tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

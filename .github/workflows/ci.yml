name: Project checks

on:
  push:
    branches:
      - main
      - feature/citizen-report-workflow
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight AI test dependencies
        run: python -m pip install fastapi==0.104.1 sqlalchemy==2.0.23 python-multipart==0.0.6 python-jose[cryptography]==3.3.0 passlib==1.7.4 bcrypt==4.0.1 pydantic==2.5.0 pydantic-settings==2.1.0 email-validator opencv-python-headless==4.8.1.78 numpy==1.26.2 pillow==10.1.0 python-dotenv==1.0.0
      - name: Check Python syntax
        run: python -m compileall -q backend/app backend/tests
      - name: Import API and verify route registration
        run: python -c "import sys; sys.path.insert(0, 'backend'); from app.main import app; assert any(route.path == '/api/citizen-reports' for route in app.routes); assert any(route.path == '/api/tickets/{ticket_id}/verification' for route in app.routes); print('API startup smoke test passed')"
      - name: Run lightweight unit tests
        run: python -m unittest discover -s backend/tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
